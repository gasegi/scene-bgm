# 素材サイト公式YouTubeチャンネルから曲情報を取り直し、変化があればコミットする。
# YouTube API ポリシー（取得データは30日以内に更新）を満たすため週1回実行。
name: update-catalog

on:
  schedule:
    - cron: '0 18 * * 0' # 毎週月曜 3:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch from YouTube Data API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-youtube.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "曲データを更新 ($(date -u +%Y-%m-%d))"
          git push
          # 念のため GitHub Pages の再ビルドを依頼（失敗しても続行）
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
